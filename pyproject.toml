[project]
name = "multi-source-rag-app"
version = "0.1.0"
description = "Multi-source document RAG API using Qdrant, Redis, and Ollama."
requires-python = ">=3.11,<3.13"
dependencies = [
  "qdrant-client>=1.10.0",
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "numpy>=1.26.4",
  "ollama>=0.4.7",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.18",
  "rank-bm25>=0.2.2",
  "redis>=5.0.0",
  "streamlit>=1.41.0",
  "uvicorn[standard]>=0.32.0",
  "gradio>=4.44.0",
]

[project.optional-dependencies]
multilingual = [
  "sentence-transformers>=3.3.1",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app", "src/rag_api"]
